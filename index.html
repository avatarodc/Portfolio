<!doctype html>
<html lang="%SEO_LANG%">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/papis.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Thème appliqué avant le premier affichage (même logique que src/hooks/useTheme.tsx) :
         évite le flash clair → sombre et les transitions de couleur au chargement. -->
    <script>
      try {
        var t = localStorage.getItem('portfolio-theme');
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>

    <!-- Langue mémorisée : arrivée sur / alors que l'anglais a été choisi -> /en/
         (l'URL reste prioritaire : /en/ n'est jamais redirigée). -->
    <script>
      try {
        if (location.pathname === '/' && localStorage.getItem('portfolio-lang') === 'en') {
          location.replace('/en/' + location.hash);
        }
      } catch (e) {}
    </script>

    <!-- seo:start -->
    <!-- Valeurs injectées depuis src/data/seo.ts, par langue (voir vite.config.ts) -->
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <link rel="canonical" href="%SEO_URL%" />

    <!-- Open Graph (LinkedIn, WhatsApp, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="%SEO_LOCALE%" />
    <meta property="og:site_name" content="%SEO_TITLE%" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_DESCRIPTION%" />
    <meta property="og:url" content="%SEO_URL%" />
    <meta property="og:image" content="%SEO_IMAGE%" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="%SEO_IMAGE_WIDTH%" />
    <meta property="og:image:height" content="%SEO_IMAGE_HEIGHT%" />
    <meta property="og:image:alt" content="%SEO_IMAGE_ALT%" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%SEO_DESCRIPTION%" />
    <meta name="twitter:image" content="%SEO_IMAGE%" />
    <meta name="twitter:image:alt" content="%SEO_IMAGE_ALT%" />

    <!-- Versions linguistiques -->
    <meta property="og:locale:alternate" content="%SEO_LOCALE_ALT%" />
    <link rel="alternate" hreflang="fr" href="%SEO_URL_FR%" />
    <link rel="alternate" hreflang="en" href="%SEO_URL_EN%" />
    <link rel="alternate" hreflang="x-default" href="%SEO_URL_FR%" />
    <!-- seo:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
