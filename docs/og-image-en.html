<!--
  Source de public/og-image-en.png (version anglaise) (aperçu des liens partagés, 1200x630).
  Pour la régénérer après une modification :
  chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --screenshot=public/og-image-en.png docs/og-image-en.html
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Inter, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #030712;
    color: #f9fafb;
    position: relative;
  }
  /* mêmes halos et grille que le Hero du site */
  .grid {
    position: absolute; inset: 0; opacity: 0.05;
    background-image: linear-gradient(rgba(255,255,255,0.35) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.35) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); }
  .orb.a { width: 560px; height: 560px; top: -220px; right: -120px; background: rgba(59,130,246,0.22); }
  .orb.b { width: 460px; height: 460px; bottom: -240px; left: -120px; background: rgba(6,182,212,0.16); }
  .bar { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: linear-gradient(90deg, #2563eb, #06b6d4, #14b8a6); }
  .content { position: absolute; inset: 0; padding: 72px 88px; display: flex; flex-direction: column; }
  .logo { font-size: 34px; font-weight: 900; letter-spacing: -0.5px; }
  .grad { background: linear-gradient(90deg, #60a5fa, #22d3ee, #2dd4bf); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .name { margin-top: auto; font-size: 92px; font-weight: 900; line-height: 1.02; letter-spacing: -2px; }
  .role { margin-top: 22px; display: flex; align-items: center; gap: 18px; font-size: 38px; font-weight: 300; color: #d1d5db; }
  .role::before { content: ''; width: 48px; height: 2px; background: #3b82f6; }
  .stack { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; }
  .tag { padding: 9px 18px; border-radius: 12px; font-size: 22px; font-weight: 600; color: #93c5fd; background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.25); }
  .footer { margin-top: 44px; display: flex; justify-content: space-between; font-size: 22px; color: #9ca3af; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="bar"></div>
  <div class="content">
    <div class="logo"><span class="grad">MG</span>.dev</div>
    <div class="name">Mamadou <span class="grad">Gueye</span></div>
    <div class="role">Full Stack Developer</div>
    <div class="stack">
      <span class="tag">Java / Spring Boot</span>
      <span class="tag">PHP / Laravel</span>
      <span class="tag">Angular / React</span>
      <span class="tag">Flutter</span>
      <span class="tag">AI</span>
    </div>
    <div class="footer">
      <span>Dakar, Senegal</span>
      <span>mamadou-gueye.vercel.app</span>
    </div>
  </div>
</body>
</html>
